name: Build image (main)

# Runs only after CI has passed on main - never builds/pushes an image from
# code that failed typecheck/build. Uses deploy/gcp/cloudbuild.web.yaml
# unchanged (build + Artifact Registry push only, no Cloud Run deploy here).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write # required for WIF - google-github-actions/auth exchanges this for a short-lived GCP access token, no JSON key involved

jobs:
  build:
    # All three must hold: CI actually passed, the run that triggered CI was
    # itself a push (not e.g. a PR run against a fork), and that push landed
    # on main - otherwise this could build from an unintended ref.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # WIF only - no service-account JSON key anywhere in this repo or in
      # GitHub Secrets. Pool/provider/both SAs already exist in
      # tripprice-cr-bypass with least-privilege bindings: github-build has
      # cloudbuild.builds.editor + serviceusage.serviceUsageConsumer
      # (project-level - cloudbuild.builds.editor has no resource-level
      # equivalent), plus storage.objectCreator/objectViewer scoped to just
      # the gs://tripprice-cr-bypass_cloudbuild staging bucket (`gcloud
      # builds submit` uploads source there - cloudbuild.builds.editor alone
      # doesn't cover that bucket's legacy ACL, which otherwise only
      # recognizes projectEditor/Owner/Viewer). No Artifact Registry
      # permissions on this SA - this job's job is CI-passed -> submit ->
      # image exists; the actual push runs as Cloud Build's own execution
      # identity, and resolving/verifying the digest is
      # deploy-production.yml's job (github-run-deploy has repo-scoped
      # artifactregistry.reader for exactly that).
      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/797791804262/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-build@tripprice-cr-bypass.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      # No pipe to `tee` here on purpose: `cmd | tee file` exits with tee's
      # status (always 0), not cmd's, so a real `gcloud builds submit`
      # failure would silently read as step success and BUILD_ID would end
      # up empty - `set -euo pipefail` plus capturing the command's own
      # output directly avoids both failure modes.
      - name: Submit Cloud Build
        id: build
        run: |
          set -euo pipefail
          BUILD_ID="$(gcloud builds submit \
            --config=deploy/gcp/cloudbuild.web.yaml \
            --project=tripprice-cr-bypass \
            --substitutions=_GIT_SHA=${{ github.event.workflow_run.head_sha }} \
            --format="value(id)" \
            .)"
          test -n "$BUILD_ID"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          {
            echo "## Build succeeded"
            echo "- commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- Cloud Build ID: \`$BUILD_ID\`"
            echo "- image tag: \`asia-northeast3-docker.pkg.dev/tripprice-cr-bypass/tripprice/web:git-${{ github.event.workflow_run.head_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
