# Nginx reverse proxy for tripprice-web (PM2-managed `next start` on :3000).
#
# Install: copy to /etc/nginx/sites-available/tripprice.conf, symlink into
# sites-enabled, replace your-domain.example, then `nginx -t && systemctl
# reload nginx`. See deploy/README.md for the full command sequence,
# including adding HTTPS via certbot afterwards.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example www.your-domain.example;

    access_log /var/log/nginx/tripprice.access.log;
    error_log  /var/log/nginx/tripprice.error.log;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
