# Builds deploy/gcp/Dockerfile.web from the repo root and pushes it to the
# tripprice-cr-bypass Artifact Registry repo created for this project - never
# tripprice-prod's registry. Build + push only; Cloud Run deploy is a
# separate, explicit step (.github/workflows/deploy-production.yml), not
# part of this config.
#
# Two tags per build, both pointing at the same digest, so an image can be
# found by either identifier - never by a mutable "latest":
#   - :build-$BUILD_ID - $BUILD_ID is a Cloud Build substitution, unique per
#     invocation, always present even for a manual `gcloud builds submit`.
#   - :git-${_GIT_SHA} - set by the GitHub Actions build workflow to the
#     merged commit's SHA (`--substitutions=_GIT_SHA=<sha>`), so the
#     production-deploy workflow can look an image up by the commit an
#     operator picks in GitHub, then resolve that tag to its immutable
#     sha256 digest right before deploying. Defaults to "unknown" so a
#     substitution-less manual submit (as used for the initial security-fix
#     build) still works.
substitutions:
  _GIT_SHA: "unknown"
  # GA4 Measurement ID - a public identifier (like a site's own domain), not
  # a secret, so it's a plain substitution rather than a Secret Manager
  # entry. Empty by default: no real ID exists anywhere yet (checked repo,
  # local env files, and both projects' Secret Manager - see commit message)
  # so this stays unset until one is actually provided, keeping GA exactly
  # as disabled as it already is. NEXT_PUBLIC_ vars are inlined into the
  # build by Next.js itself (see next.config.mjs/proxy.ts CSP work) - a
  # Cloud Run *runtime* env var can never make GA_MEASUREMENT_ID take
  # effect, only a build-time value reaching `npm run build` can.
  _GA_MEASUREMENT_ID: ""
  # Production canonical URL - public, non-secret. Empty by default so a
  # substitution-less manual submit still builds (web/app/lib/seo.ts omits
  # canonical/sitemap entirely rather than guessing a domain when unset).
  _SITE_URL: ""

# Pins the build's own execution identity - without this, Cloud Build runs
# as this project's default Compute Engine SA, which the submitting
# identity (github-build, in .github/workflows/build.yml) was deliberately
# never granted actAs on (that SA lost project-level Editor earlier in this
# project's hardening, and re-granting broad access to it here would
# undercut that). cloudbuild-runner is a small dedicated SA that only has
# AR write on the tripprice repo, read on the staging bucket, and
# project-level log-write - github-build has iam.serviceAccountUser scoped
# to just this one SA. options.logging must stay a non-default value
# (CLOUD_LOGGING_ONLY below) whenever serviceAccount is set - Cloud Build
# requirement.
serviceAccount: "projects/tripprice-cr-bypass/serviceAccounts/cloudbuild-runner@tripprice-cr-bypass.iam.gserviceaccount.com"

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -f
      - deploy/gcp/Dockerfile.web
      - --build-arg
      - NEXT_PUBLIC_GA_MEASUREMENT_ID=${_GA_MEASUREMENT_ID}
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - -t
      - asia-northeast3-docker.pkg.dev/tripprice-cr-bypass/tripprice/web:build-$BUILD_ID
      - -t
      - asia-northeast3-docker.pkg.dev/tripprice-cr-bypass/tripprice/web:git-${_GIT_SHA}
      - .

images:
  - asia-northeast3-docker.pkg.dev/tripprice-cr-bypass/tripprice/web:build-$BUILD_ID
  - asia-northeast3-docker.pkg.dev/tripprice-cr-bypass/tripprice/web:git-${_GIT_SHA}

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
